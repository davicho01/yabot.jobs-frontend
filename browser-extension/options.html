<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Yabot Jobs — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options">
      <h1>Yabot Jobs</h1>
      <p class="options__intro">
        Connects this extension to your Yabot Jobs account. Sign in to the web app, open
        <strong>Access tokens</strong> from your account menu, create one (label it "Browser extension"), and paste
        it below.
      </p>

      <label>
        Yabot Jobs API URL
        <input id="api-base-url" type="url" placeholder="https://api.yabot.jobs" autocomplete="off" />
      </label>

      <label>
        Access token
        <input id="token" type="password" placeholder="Paste your access token" autocomplete="off" />
      </label>

      <div class="options__actions">
        <button id="save" type="button">Save</button>
        <button id="test" class="options__secondary" type="button">Test connection</button>
      </div>

      <p id="status" class="options__status" hidden></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>

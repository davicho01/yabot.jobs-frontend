name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for OIDC federation to AWS

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        # --exclude protects the SEO static-job-pages tree (jobs/, _meta/,
        # sitemap-jobs.xml) published separately by generate_static_job_pages.py
        # into this same bucket — none of it comes from dist/, so without these
        # excludes --delete wipes all accumulated history on every deploy.
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}" --delete \
            --exclude "jobs/*" \
            --exclude "_meta/*" \
            --exclude "sitemap-jobs.xml"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Source for public/og-image.png. Fixed at 1200x630 (the standard OG size,
      and what public/og-image.png already is) rather than responsive, because
      this is only ever rendered once, by deploy/og-image/generate.mjs, at that
      exact viewport.

      Keep the copy here in sync with the hero section in index.html
      (.hero__title, .hero__sub, .fineprint, the CTA row) by hand — this file
      intentionally doesn't import index.html, since the hero is full-page and
      responsive and this is a fixed-size crop of it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ffffff;
        --ink: #1d1d1f;
        --ink-soft: #6e6e73;
        --accent: #0071e3;
        --accent-bright: #2997ff;
        --violet: #7b61ff;
        --cyan: #00c2ff;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Manrope", system-ui, sans-serif;
        --radius-pill: 980px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        background: var(--paper);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(50px);
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 0 0 0 64px;
        width: 700px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .brand__mark {
        width: 26px;
        height: 26px;
        color: var(--accent);
      }

      .brand__accent {
        color: var(--accent);
      }

      .eyebrow {
        font-size: 19px;
        font-weight: 700;
        color: var(--accent);
      }

      h1 {
        font-weight: 800;
        font-size: 54px;
        line-height: 1.08;
        letter-spacing: -0.035em;
        color: var(--ink);
      }

      h1 em {
        font-style: normal;
        background: linear-gradient(90deg, var(--accent), var(--violet));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .sub {
        font-size: 22px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink-soft);
      }

      .cta-row {
        display: flex;
        align-items: center;
        gap: 20px;
        padding-top: 4px;
      }

      .btn {
        display: inline-block;
        font-weight: 600;
        font-size: 18px;
        padding: 14px 28px;
        border-radius: var(--radius-pill);
        background: var(--accent);
        color: var(--paper);
      }

      .btn--text {
        font-weight: 600;
        font-size: 18px;
        color: var(--accent);
      }

      .fineprint {
        font-size: 15px;
        color: var(--ink-soft);
      }

      .shot {
        position: absolute;
        top: 108px;
        right: 44px;
        width: 400px;
        background: #1d1d1f;
        border-radius: 48px 48px 0 0;
        padding: 12px 12px 0;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.18);
        z-index: 1;
        overflow: hidden;
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 38px 38px 0 0;
      }
    </style>
  </head>

  <body>
    <span
      class="glow"
      style="top: -220px; left: -160px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(0, 113, 227, 0.35) 0%, rgba(0, 0, 0, 0) 68%)"
    ></span>
    <span
      class="glow"
      style="top: -120px; right: -200px; width: 680px; height: 680px; background: radial-gradient(circle, rgba(123, 97, 255, 0.3) 0%, rgba(0, 0, 0, 0) 68%)"
    ></span>
    <span
      class="glow"
      style="top: 320px; left: 30%; width: 620px; height: 620px; background: radial-gradient(circle, rgba(0, 194, 255, 0.3) 0%, rgba(0, 0, 0, 0) 68%)"
    ></span>

    <div class="content">
      <span class="brand">
        <svg class="brand__mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path
            d="M9 24h6l4-10 6 20 4-10h10"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Yabot <span class="brand__accent">Jobs</span></span>
      </span>

      <p class="eyebrow">Free, open source job search</p>
      <h1>Tailor your resume.<br /><em>Apply with confidence.</em></h1>
      <p class="sub">New jobs every day. See your fit before you apply.</p>

      <div class="cta-row">
        <span class="btn">Start free</span>
        <span class="btn--text">Browse jobs &rsaquo;</span>
      </div>

      <p class="fineprint">Your first 10 jobs are on us. No credit card needed.</p>
    </div>

    <figure class="shot">
      <img
        src="../../public/landing/hero-phone-steps.png"
        alt="A job showing a fit score of 82, a tailored resume score of 90, and steps for cover letter, apply, and interview prep."
      />
    </figure>
  </body>
</html>
